# Replace with real IPs/hostnames after `terraform apply`.
# Get Jenkins host IP from: terraform output (if you provision a dedicated Jenkins EC2)
[jenkins]
jenkins-server ansible_host=<JENKINS_EC2_PUBLIC_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/jenkins-key.pem

# Bastion / utility box that has aws-cli + kubectl configured to talk to EKS,
# useful if you're not running these commands from your own laptop.
[utility]
utility-box ansible_host=<UTILITY_EC2_PUBLIC_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/jenkins-key.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
